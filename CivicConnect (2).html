<html lang="en">

<meta name="description" content="CivicConnect is an AI-assisted civic issue reporting and resolution platform connecting citizens, authorities and field workers. Prototype / Demo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --paper:#F3F6F2;--card:#FFFFFF;--ink:#10243A;--muted:#566876;--line:#D9E1DC;--soft:#E8EFEA;
 --brand:#0A6C6B;--brand-2:#0E8583;--on-brand:#FFFFFF;--accent:#F2A900;--accent-ink:#3B2A00;
 --crit:#B93526;--high:#C9640F;--med:#8F6B00;--low:#27784B;--info:#235A9C;--purple:#6A44A0;
 --crit-bg:#FBE8E5;--high-bg:#FCEEDD;--med-bg:#FAF1CF;--low-bg:#E1F2E8;--info-bg:#E1ECF8;--purple-bg:#EDE6F7;--mute-bg:#E8EDEA;--brand-bg:#DDF0EF;
 --map-water:#BCDCE8;--map-land:#EDF1E8;--map-park:#CBE3C4;--map-road:#FFFFFF;--map-road2:#D5DCD3;--map-text:#6B7B72;
 --c1:#0A6C6B;--c2:#F2A900;--c3:#B93526;--c4:#235A9C;--c5:#6A44A0;--c6:#27784B;--c7:#C9640F;--c8:#6B7B88;--c9:#B5527A;
 --shadow:0 1px 2px rgba(16,36,58,.06),0 8px 24px rgba(16,36,58,.05);
 --focus:#1D6FD6;
 color-scheme:light;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --paper:#0D1822;--card:#14232F;--ink:#E6EEF2;--muted:#9DB0BC;--line:#243948;--soft:#1B2D3B;
 --brand:#47C6BD;--brand-2:#6FD8D0;--on-brand:#052321;--accent:#F5B82E;--accent-ink:#2A1D00;
 --crit:#FF8A7A;--high:#FFAE63;--med:#E9C34A;--low:#6FD29B;--info:#7FB4F0;--purple:#B79BE8;
 --crit-bg:#3A1D1A;--high-bg:#3A2713;--med-bg:#35290B;--low-bg:#173325;--info-bg:#172B42;--purple-bg:#2A2140;--mute-bg:#1E3040;--brand-bg:#12363A;
 --map-water:#1F4558;--map-land:#17262F;--map-park:#1B3A2C;--map-road:#2A3F4E;--map-road2:#223646;--map-text:#7F95A3;
 --c1:#47C6BD;--c2:#F5B82E;--c3:#FF8A7A;--c4:#7FB4F0;--c5:#B79BE8;--c6:#6FD29B;--c7:#FFAE63;--c8:#9DB0BC;--c9:#E58DB3;
 --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--focus:#8DC1FF;color-scheme:dark;}}
:root[data-theme="dark"]{
 --paper:#0D1822;--card:#14232F;--ink:#E6EEF2;--muted:#9DB0BC;--line:#243948;--soft:#1B2D3B;
 --brand:#47C6BD;--brand-2:#6FD8D0;--on-brand:#052321;--accent:#F5B82E;--accent-ink:#2A1D00;
 --crit:#FF8A7A;--high:#FFAE63;--med:#E9C34A;--low:#6FD29B;--info:#7FB4F0;--purple:#B79BE8;
 --crit-bg:#3A1D1A;--high-bg:#3A2713;--med-bg:#35290B;--low-bg:#173325;--info-bg:#172B42;--purple-bg:#2A2140;--mute-bg:#1E3040;--brand-bg:#12363A;
 --map-water:#1F4558;--map-land:#17262F;--map-park:#1B3A2C;--map-road:#2A3F4E;--map-road2:#223646;--map-text:#7F95A3;
 --c1:#47C6BD;--c2:#F5B82E;--c3:#FF8A7A;--c4:#7FB4F0;--c5:#B79BE8;--c6:#6FD29B;--c7:#FFAE63;--c8:#9DB0BC;--c9:#E58DB3;
 --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--focus:#8DC1FF;color-scheme:dark;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100vh}
h1,h2,h3,h4{font-family:'Bricolage Grotesque','Public Sans',system-ui,sans-serif;font-weight:800;line-height:1.12;margin:0 0 .45em;letter-spacing:-.015em}
h1{font-size:clamp(2rem,5vw,3.4rem)}h2{font-size:clamp(1.45rem,3vw,2rem)}h3{font-size:1.15rem}h4{font-size:1rem}
p{margin:0 0 .8em}a{color:var(--brand);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--paper);padding:10px 14px;z-index:999}.skip:focus{left:8px;top:8px}
.muted{color:var(--muted)}.sm{font-size:.875rem}.xs{font-size:.78rem}.b{font-weight:700}.center{text-align:center}.mt{margin-top:16px}.mt2{margin-top:28px}.mb{margin-bottom:16px}.hide{display:none!important}.nowrap{white-space:nowrap}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}.col{display:flex;flex-direction:column;gap:10px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.split{display:grid;gap:20px;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media(max-width:900px){.split{grid-template-columns:1fr}}
/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr-in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);font:800 1.2rem 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
.brand svg{width:30px;height:30px}
.hnav{display:flex;gap:2px;margin-left:8px}.hnav a{padding:8px 12px;border-radius:9px;color:var(--ink);text-decoration:none;font-weight:600;font-size:.92rem}.hnav a:hover,.hnav a.on{background:var(--soft)}
@media(max-width:820px){.hnav{display:none}}
.search{position:relative;flex:1 1 220px;max-width:420px;margin-left:auto}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.search>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.sr{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:60;padding:6px}
.sr a{display:block;padding:9px 10px;border-radius:9px;color:var(--ink);text-decoration:none}.sr a:hover{background:var(--soft)}.sr small{color:var(--muted);display:block}
.sr h5{margin:8px 10px 2px;font-size:.78rem;color:var(--muted);font-weight:600}
.iconbtn{position:relative;width:40px;height:40px;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--card);border-radius:12px;cursor:pointer}
.iconbtn:hover{background:var(--soft)}.iconbtn svg{width:19px;height:19px}
.dot{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--crit);color:#fff;font-size:.7rem;font-weight:700;display:grid;place-items:center}
.sel{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);max-width:140px}
.menu{position:relative}.menu-pop{position:absolute;right:0;top:calc(100% + 8px);min-width:230px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px;display:none;z-index:70}
.menu.open .menu-pop{display:block}.menu-pop button,.menu-pop a{display:flex;gap:9px;align-items:center;width:100%;text-align:left;padding:9px 10px;background:none;border:0;border-radius:9px;color:var(--ink);cursor:pointer;text-decoration:none}
.menu-pop button:hover,.menu-pop a:hover{background:var(--soft)}.menu-pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}.menu-pop svg{width:17px;height:17px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:700;overflow:hidden;border:0;cursor:pointer}.avatar img{width:100%;height:100%;object-fit:cover}
/* layout */
.layout{max-width:1280px;margin:0 auto;padding:20px 16px 60px}
.layout.with-side{display:grid;grid-template-columns:232px minmax(0,1fr);gap:24px}
.side{position:sticky;top:calc(72px + env(safe-area-inset-top,0px));align-self:start;display:flex;flex-direction:column;gap:2px}
.side .who{padding:4px 12px 12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.nl{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--ink);text-decoration:none;font-weight:600;font-size:.95rem;border-left:3px solid transparent}
.nl svg{width:19px;height:19px;flex:none;color:var(--muted)}.nl:hover{background:var(--soft)}.nl.on{background:var(--brand-bg);border-left-color:var(--brand);color:var(--brand)}.nl.on svg{color:var(--brand)}
.nl .dot{position:static;margin-left:auto}
@media(max-width:900px){.layout.with-side{grid-template-columns:1fr}.side{display:none}.layout{padding-bottom:96px}}
.bnav{display:none}
@media(max-width:900px){.bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav a,.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;min-height:54px;border:0;background:none;color:var(--muted);text-decoration:none;font-size:.7rem;font-weight:600;border-radius:12px;cursor:pointer}
.bnav svg{width:22px;height:22px}.bnav .on{color:var(--brand);background:var(--brand-bg)}}
/* page head */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}.ph h1{font-size:clamp(1.6rem,3.4vw,2.2rem);margin:0}.ph p{margin:4px 0 0;color:var(--muted)}
/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{background:var(--soft)}.btn svg{width:18px;height:18px;flex:none}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}.btn.pri:hover{background:var(--brand-2)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dan{background:var(--crit-bg);border-color:transparent;color:var(--crit)}
.btn.ok{background:var(--low-bg);border-color:transparent;color:var(--low)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.88rem;border-radius:9px}.btn.lg{min-height:52px;padding:13px 24px;font-size:1.05rem}.btn.wide{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.busy::after{content:"";width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}.field>label,.lbl{font-weight:600;font-size:.9rem}
.field input,.field select,.field textarea,.in{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--card);min-height:44px}
.field textarea{min-height:110px;resize:vertical}.hint{font-size:.82rem;color:var(--muted)}.err{color:var(--crit);font-size:.86rem;font-weight:600}
.field.bad input,.field.bad textarea,.field.bad select{border-color:var(--crit)}
.pw{position:relative}.pw button{position:absolute;right:6px;top:6px;height:32px;border:0;background:none;color:var(--muted);cursor:pointer;font-weight:600;font-size:.82rem}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;cursor:pointer;margin-bottom:10px}.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--brand);flex:none}
input[type=range]{accent-color:var(--brand);min-height:30px;padding:0}
.form-err{background:var(--crit-bg);color:var(--crit);padding:10px 14px;border-radius:11px;font-weight:600;margin-bottom:14px}
/* card */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}.card h3{margin-bottom:.6em}.card.pad0{padding:0;overflow:hidden}
.stat{padding:16px 18px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;text-decoration:none;color:inherit}
.stat b{font:800 1.9rem 'Bricolage Grotesque',sans-serif;line-height:1.1}.stat span{color:var(--muted);font-size:.86rem;font-weight:600}
a.stat:hover{border-color:var(--brand)}.stat.warn b{color:var(--crit)}
/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:700;white-space:nowrap;background:var(--mute-bg);color:var(--ink)}
.s-info{background:var(--info-bg);color:var(--info)}.s-brand{background:var(--brand-bg);color:var(--brand)}.s-purple{background:var(--purple-bg);color:var(--purple)}.s-med{background:var(--med-bg);color:var(--med)}
.s-high{background:var(--high-bg);color:var(--high)}.s-low{background:var(--low-bg);color:var(--low)}.s-crit{background:var(--crit-bg);color:var(--crit)}.s-mute{background:var(--mute-bg);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;background:var(--soft);font-size:.82rem;font-weight:600}.chip svg{width:14px;height:14px}
.proto{display:inline-flex;gap:6px;align-items:center;padding:3px 10px;border-radius:99px;border:1px dashed var(--muted);font-size:.74rem;font-weight:600;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:thin}.tabs button{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:99px;font-weight:600;font-size:.88rem;cursor:pointer;white-space:nowrap;min-height:40px}
.tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}.empty svg{width:42px;height:42px;opacity:.6;margin-bottom:8px}.empty h3{color:var(--ink)}
.load{display:grid;place-items:center;padding:36px}.load::after{content:"";width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
/* filters */
.fbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}.fbar .in,.fbar select{width:auto;min-width:130px;flex:0 1 auto;padding:8px 10px;min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card)}.fbar .in.q{flex:1 1 220px}
/* issue cards */
.icard{display:block;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:12px;padding:14px 16px;text-decoration:none;color:inherit;box-shadow:var(--shadow)}
.icard:hover{border-color:var(--brand)}.icard.p-Critical{border-left-color:var(--crit)}.icard.p-High{border-left-color:var(--high)}.icard.p-Medium{border-left-color:var(--med)}.icard.p-Low{border-left-color:var(--low)}
.icard h4{margin:6px 0 4px}.icard .meta{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--muted);font-size:.84rem}.icard .meta span{display:inline-flex;gap:5px;align-items:center}.icard .meta svg{width:14px;height:14px}
.progress{height:7px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:var(--brand);border-radius:99px}
.list{display:grid;gap:12px}
/* table */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:640px}th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:.9rem;vertical-align:middle}
th{font-weight:700;color:var(--muted);font-size:.8rem;background:var(--soft);white-space:nowrap}tr:last-child td{border-bottom:0}tbody tr:hover{background:color-mix(in srgb,var(--soft) 55%,transparent)}
td a{font-weight:700;text-decoration:none}
/* sla */
.sla{font-weight:700;font-size:.84rem;display:inline-flex;gap:6px;align-items:center}.sla::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.sla.ok{color:var(--low)}.sla.near{color:var(--med)}.sla.over{color:var(--crit)}.sla.none{color:var(--muted)}
.banner{border-radius:12px;padding:12px 16px;display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;font-weight:600}.banner svg{width:20px;height:20px;flex:none;margin-top:2px}
.banner.crit{background:var(--crit-bg);color:var(--crit)}.banner.warn{background:var(--med-bg);color:var(--med)}.banner.info{background:var(--info-bg);color:var(--info)}.banner.ok{background:var(--low-bg);color:var(--low)}
/* timeline */
.tl{list-style:none;margin:0;padding:0}.tl li{position:relative;padding:0 0 18px 34px;color:var(--muted)}
.tl li::before{content:"";position:absolute;left:11px;top:22px;bottom:0;width:2px;background:var(--line)}.tl li:last-child::before{display:none}
.tl li i{position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center}
.tl li.done{color:var(--ink)}.tl li.done i{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}.tl li.done::before{background:var(--brand)}
.tl li.now i{box-shadow:0 0 0 5px var(--brand-bg);background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.tl i svg{width:13px;height:13px}.tl b{display:block;font-size:.95rem}.tl small{display:block;font-size:.8rem;color:var(--muted)}
.log{list-style:none;margin:0;padding:0;font-size:.88rem}.log li{padding:8px 0;border-bottom:1px dashed var(--line);display:flex;gap:10px;justify-content:space-between}.log li:last-child{border:0}
/* stepper */
.wz{display:flex;gap:6px;margin-bottom:20px;overflow-x:auto}.wz div{flex:1;min-width:84px;padding:8px 10px;border-radius:10px;background:var(--soft);font-size:.8rem;font-weight:700;color:var(--muted);border-bottom:4px solid transparent}
.wz div.on{background:var(--brand-bg);color:var(--brand);border-bottom-color:var(--brand)}.wz div.done{color:var(--low);border-bottom-color:var(--low)}
/* choice cards */
.choice{display:flex;gap:12px;align-items:center;padding:14px;border:2px solid var(--line);border-radius:13px;background:var(--card);cursor:pointer;text-align:left;width:100%}
.choice:hover{border-color:var(--brand)}.choice.on{border-color:var(--brand);background:var(--brand-bg)}
.choice svg{width:26px;height:26px;color:var(--brand);flex:none}.choice b{display:block}.choice small{color:var(--muted)}
/* map */
.map{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--map-land);touch-action:none}
.map svg.mp{display:block;width:100%;height:auto;cursor:grab;user-select:none}.map.pick svg.mp{cursor:crosshair}
.map .zc{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}.map .zc button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700;cursor:pointer;font-size:1.1rem}
.map .cap{position:absolute;left:10px;bottom:8px;font-size:.7rem;font-weight:600;background:color-mix(in srgb,var(--card) 85%,transparent);padding:2px 8px;border-radius:99px;color:var(--muted)}
.pop{margin-top:12px}
/* ring */
.ring{--v:0;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--rc,var(--brand)) calc(var(--v)*1%),var(--soft) 0)}
.ring>div{width:76px;height:76px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;line-height:1}.ring b{font:800 1.6rem 'Bricolage Grotesque',sans-serif}.ring small{font-size:.65rem;color:var(--muted);font-weight:600}
.fbarrow{display:grid;grid-template-columns:120px 1fr 38px;gap:8px;align-items:center;font-size:.84rem;margin:6px 0}.fbarrow .tr{height:8px;background:var(--soft);border-radius:9px;overflow:hidden}.fbarrow .tr i{display:block;height:100%;background:var(--brand)}

<body>
<div id="root"></div>
<div id="modal-root"></div>
<div id="toasts" aria-live="polite" aria-atomic="false"></div>
<div id="printArea"></div>
<script>
'use strict';
/* =====================================================================
   CivicConnect — core (storage, seed data, AI-assisted simulation,
   priority engine, SLA, REST-shaped API). Frontend-only prototype:
   api(method, path, body) mirrors the future Express routes, so each
   handler can later be swapped for fetch('/api/...').
   ===================================================================== */
const mkStore=k=>{try{const s=window[k];s.setItem('__t','1');s.removeItem('__t');return s}catch(e){const m={};return{getItem:x=>x in m?m[x]:null,setItem:(x,v)=>{m[x]=String(v)},removeItem:x=>{delete m[x]}}}};
const LS=mkStore('localStorage'),SS=mkStore('sessionStorage');
const H=3600e3,D=24*H,KEY='cc_db_v1',BOOT=Date.now();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=(p='')=>p+Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-');
const fmtDate=t=>t?new Date(t).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'—';
const fmtDT=t=>t?new Date(t).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):'—';
const ago=t=>{const d=Date.now()-t;if(d<6e4)return'just now';if(d<H)return Math.floor(d/6e4)+' min ago';if(d<D)return Math.floor(d/H)+' h ago';return Math.floor(d/D)+' d ago'};
const dur=ms=>{const a=Math.abs(ms);if(a<H)return Math.max(1,Math.round(a/6e4))+' min';if(a<2*D)return Math.round(a/H)+' h';return Math.round(a/D)+' days'};
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return'h'+(h>>>0).toString(36)};
const haversine=(a,b,c,d)=>{const R=6371000,t=x=>x*Math.PI/180,dl=t(c-a),dn=t(d-b),q=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(q))};
const fmtDist=m=>m<1000?Math.max(10,Math.round(m/10)*10)+' m':(m/1000).toFixed(1)+' km';

/* ---------- constants ---------- */
const LIFE=['Reported','AI Analyzed','Verified','Prioritized','Assigned','In Progress','Pending Approval','Resolved','Citizen Confirmed','Closed'];
const LIFE_TEXT={'Reported':'Report submitted','AI Analyzed':'AI-assisted analysis','Verified':'Authority verification','Prioritized':'Priority and SLA set','Assigned':'Department assignment','In Progress':'Worker started','Pending Approval':'Work completed','Resolved':'Authority reviewed','Citizen Confirmed':'Citizen confirmed','Closed':'Closed'};
const STATUS_CLS={'Reported':'s-info','AI Analyzed':'s-info','Verified':'s-brand','Prioritized':'s-brand','Assigned':'s-purple','In Progress':'s-med','Pending Approval':'s-high','Resolved':'s-low','Citizen Confirmed':'s-low','Closed':'s-mute','Rejected':'s-crit','Duplicate':'s-mute','Reopened':'s-high','Appealed':'s-purple'};
const PRIO_CLS={Critical:'s-crit',High:'s-high',Medium:'s-med',Low:'s-low'};
const LEVELS=['Critical','High','Medium','Low'];
const BOUNDS={minLat:17.33,maxLat:17.51,minLng:78.33,maxLng:78.58};
const DEMO_LOC={lat:17.4310,lng:78.4560,name:'Begumpet, Hyderabad'};
const GAZ=[['Ameerpet',17.4375,78.4483],['Begumpet',17.4440,78.4676],['Secunderabad',17.4399,78.4983],['Kukatpally',17.4948,78.3996],['Madhapur',17.4486,78.3908],['Banjara Hills',17.4156,78.4347],['Charminar',17.3616,78.4747],['Gachibowli',17.4401,78.3489],['LB Nagar',17.3457,78.5522],['Uppal',17.4058,78.5591],['Tarnaka',17.4285,78.5330],['Dilsukhnagar',17.3688,78.5247],['Chaderghat',17.3720,78.4900],['Hitech City',17.4510,78.3805],['Paradise Circle',17.4416,78.4870]].map(a=>({name:a[0],lat:a[1],lng:a[2]}));
const PROFANE=['idiot','stupid','damn','shit','bastard','fool'];
const CATS=[
{id:'roads',name:'Roads & Transport',icon:'road',dept:'d_roads',subs:['Pothole','Damaged road','Footpath','Traffic signal','Road markings'],kw:['pothole','road','traffic','signal','footpath','pavement','speed breaker','divider','zebra','crater','asphalt','two-wheeler','junction','vehicle']},
{id:'water',name:'Water Supply',icon:'drop',dept:'d_water',subs:['Pipeline leak','No supply','Contaminated water','Low pressure','Public tap'],kw:['water','leak','pipeline','pipe','tap','supply','borewell','tanker','contaminated','drinking']},
{id:'drainage',name:'Drainage & Sewage',icon:'waves',dept:'d_drain',subs:['Blocked drain','Open sewage','Manhole','Flooding','Stagnant water'],kw:['drain','drainage','sewage','sewer','manhole','flood','waterlogging','stagnant','clog','blocked']},
{id:'garbage',name:'Garbage & Sanitation',icon:'trash',dept:'d_sanit',subs:['Bin overflow','Illegal dumping','Waste pile','Missed collection','Dead animal'],kw:['garbage','waste','trash','litter','dump','bin','sanitation','dustbin','smell','rubbish','debris']},
{id:'electricity',name:'Electricity & Streetlights',icon:'bolt',dept:'d_elec',subs:['Streetlight','Pole / wires','Transformer','Power outage','Meter'],kw:['electric','streetlight','street light','light','pole','wire','transformer','power','outage','voltage','spark']},
{id:'agriculture',name:'Agriculture & Irrigation',icon:'leaf',dept:'d_agri',subs:['Canal / irrigation','Pump failure','Farm road','Tank / pond','Crop damage'],kw:['irrigation','canal','farm','crop','field','farmer','pump','agricultur','paddy','fertilizer','silt']},
{id:'schools',name:'Schools & Health',icon:'cross',dept:'d_health',subs:['School building','Hospital / clinic','Classroom facilities','Anganwadi','Sanitation in school'],kw:['school','hospital','clinic','health','classroom','dispensary','anganwadi','medical','teacher','student']},
{id:'environment',name:'Environment & Animals',icon:'tree',dept:'d_env',subs:['Stray animals','Tree fall / cutting','Air or noise pollution','Burning waste','Water body'],kw:['tree','animal','stray','dog','cattle','cow','pollution','smoke','noise','plastic','burning']},
{id:'public',name:'Public Infrastructure',icon:'bridge',dept:'d_pwd',subs:['Public toilet','Bus shelter','Park / playground','Bridge / culvert','Community hall'],kw:['park','bench','bridge','building','toilet','bus stand','bus shelter','playground','community hall','culvert']}];
const SUG_CATS=['Roads','Water','Sanitation','Safety','Environment','Education','Healthcare','Public Services','Other'];
const SUG_STATUS=['Submitted','Under Review','Accepted','Rejected','Implemented','Completed'];
const catOf=id=>(DB.categories.find(c=>c.id===id))||{id,name:id,icon:'pin',dept:null,subs:['General'],kw:[]};
const deptOf=id=>DB.departments.find(d=>d.id===id)||null;
const userOf=id=>DB.users.find(u=>u.id===id)||null;
const me=()=>{const id=SESSION.userId;return id?userOf(id):null};
let SESSION={userId:LS.getItem('cc_session')||SS.getItem('cc_session')||null};

/* ---------- sample photos (inline SVG, so the demo works offline) ---------- */
const samplePhoto=(label,tone)=>{const c={before:['#7a6a58','#3f362d'],after:['#86c19a','#3f7d56'],issue:['#9fb0ba','#5c6e7a']}[tone||'issue'];
const hole=tone==='after'?'':`<ellipse cx='330' cy='338' rx='96' ry='28' fill='rgba(0,0,0,.5)'/><ellipse cx='330' cy='330' rx='80' ry='20' fill='rgba(0,0,0,.35)'/>`;
const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='640' height='420' viewBox='0 0 640 420'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='${c[0]}'/><stop offset='1' stop-color='${c[1]}'/></linearGradient></defs><rect width='640' height='420' fill='url(#g)'/><path d='M0 290 Q160 262 320 286 T640 276 V420 H0Z' fill='rgba(0,0,0,.28)'/><path d='M0 372 H640' stroke='rgba(255,255,255,.35)' stroke-width='4' stroke-dasharray='40 28'/>${hole}<text x='24' y='46' font-family='sans-serif' font-size='22' font-weight='700' fill='white'>${esc(label).slice(0,38)}</text><text x='24' y='74' font-family='sans-serif' font-size='15' fill='rgba(255,255,255,.85)'>Sample photo for the demo</text></svg>`;
return'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)};

/* ---------- settings ---------- */
const defaultSettings=()=>({weights:{severity:30,impact:25,safety:20,community:15,age:10},thresholds:{Critical:80,High:60,Medium:40},
sla:{Critical:24,High:48,Medium:120,Low:240},dup:{radius:500,threshold:.4},
templates:{verified:'Your report {id} was verified by the authority.',assigned:'Your issue {id} has been assigned to the {dept}.',started:'A field worker started work on {id}.',pending:'Work on {id} is awaiting resolution verification.',resolved:'Your issue {id} has been marked resolved. Please confirm.',appeal:'Your appeal for {id} has been reviewed.'}});

/* ---------- priority engine ---------- */
const SEV={Low:.25,Medium:.5,High:.75,Critical:1},IMP={Low:.3,Medium:.55,High:.8,'Very high':1},SAFE={None:.1,Moderate:.55,High:1};
const levelOf=s=>{const t=DB.settings.thresholds;return s>=t.Critical?'Critical':s>=t.High?'High':s>=t.Medium?'Medium':'Low'};
function computePriority(i){
  const w=DB.settings.weights,sum=Object.values(w).reduce((a,b)=>a+b,0)||100;
  const conf=(i.confirmations||[]).length,dups=(i.duplicateIds||[]).length+(i.mergedIds||[]).length;
  const days=(Date.now()-i.createdAt)/D;
  const f={severity:SEV[i.severity]??.5,impact:IMP[i.impact]??.55,safety:SAFE[i.safetyRisk]??.1,community:clamp((conf+dups*4)/20,0,1),age:clamp(days/14,0,1)};
  const base=(f.severity*w.severity+f.impact*w.impact+f.safety*w.safety+f.community*w.community+f.age*w.age)/sum*100;
  const score=clamp(Math.round(base+(i.bonus||0)),0,100);
  const why=[];
  if(f.severity>=.75)why.push(`the reported severity is ${i.severity.toLowerCase()}`);
  if(f.safety>=.55)why.push('it is a safety risk');
  if(f.impact>=.8)why.push('it affects a busy or high-footfall area');
  if(conf>=10)why.push(`${conf} citizens confirmed it`);else if(conf>=3)why.push(`${conf} citizens have confirmed it`);
  if(dups>0)why.push(`${dups} similar report${dups>1?'s were':' was'} found nearby`);
  if(days>=3)why.push(`it has been open for ${Math.floor(days)} days`);
  const level=levelOf(score);
  const explanation=`${level} priority because ${why.length?why.slice(0,4).join(', ').replace(/, ([^,]*)$/,' and $1'):'of the reported severity and location'}.`;
  return{score,level,factors:f,explanation};
}
function refreshPriority(i){
  if(i.manualPriority){i.priorityInfo={factors:computePriority(i).factors,explanation:`Priority set to ${i.manualPriority.level} by an authority: ${i.manualPriority.reason}`};return}
  const p=computePriority(i);i.priorityScore=p.score;i.priorityLevel=p.level;i.priorityInfo={factors:p.factors,explanation:p.explanation};
}
const slaHours=(level,deptId)=>{const d=deptOf(deptId);return Math.min(DB.settings.sla[level]||120,d&&d.sla?d.sla:9999)};
function setSla(i,hours){const hrs=Number(hours)||slaHours(i.priorityLevel,i.department||i.aiDepartment);i.sla={hours:hrs,start:Date.now(),deadline:Date.now()+hrs*H,level:i.priorityLevel}}
const isOpen=i=>!['Closed','Rejected','Duplicate'].includes(i.status);
const isDone=i=>['Resolved','Citizen Confirmed','Closed'].includes(i.status);
function slaInfo(i){
  if(!i.sla)return{state:'none',label:'SLA not started'};
  if(isDone(i)&&i.resolvedAt){const met=i.resolvedAt<=i.sla.deadline;return{state:met?'ok':'over',met,label:met?'Resolved within SLA':'Resolved after SLA'}}
  if(!isOpen(i))return{state:'none',label:'—'};
  const rem=i.sla.deadline-Date.now(),total=i.sla.deadline-i.sla.start;
  if(rem<0)return{state:'over',remaining:rem,label:`Overdue by ${dur(rem)}`};
  if(rem<total*.25)return{state:'near',remaining:rem,label:`${dur(rem)} left · deadline close`};
  return{state:'ok',remaining:rem,label:`${dur(rem)} left`};
}
function escalation(i){const s=slaInfo(i);if(s.state!=='over'||!s.remaining||!isOpen(i))return null;const late=-s.remaining;
  return late<D?{level:1,who:'Department Officer'}:late<3*D?{level:2,who:'Senior Authority'}:{level:3,who:'Administrator'}}
const progressPct=i=>{if(['Rejected','Duplicate'].includes(i.status))return 100;const m={'Reported':5,'AI Analyzed':10,'Verified':20,'Prioritized':30,'Assigned':40,'Pending Approval':80,'Resolved':90,'Citizen Confirmed':95,'Closed':100,'Reopened':25,'Appealed':15};
  if(i.status==='In Progress')return 45+Math.round((i.work?.progress||0)*.3);return m[i.status]||0};
const stageIndex=i=>{const s=i.status==='Appealed'?(i.prevStatus||'Reported'):i.status;const k=LIFE.indexOf(s);return s==='Reopened'?3:k};

/* ---------- AI-assisted analysis (rule-based prototype, NOT a trained model) ---------- */
const STOP=new Set('the,and,for,with,this,that,from,are,was,has,have,had,been,not,but,its,our,you,your,will,into,over,out,all,can,may,any,onto,there,their,they,them,than,then,every,some,very,also'.split(','));
const toks=t=>new Set((String(t).toLowerCase().match(/[a-z]{3,}/g)||[]).filter(w=>!STOP.has(w)).map(w=>w.slice(0,5)));
const jacc=(a,b)=>{if(!a.size||!b.size)return 0;let n=0;a.forEach(x=>{if(b.has(x))n++});return n/(a.size+b.size-n)};
const hits=(txt,list)=>list.reduce((n,w)=>n+(txt.includes(w)?1:0),0);
function classify(text){
  const t=' '+String(text).toLowerCase()+' ';let best=null,bs=0;
  DB.categories.forEach(c=>{if(c.active===false)return;const s=hits(t,c.kw||[]);if(s>bs){bs=s;best=c}});
  const cat=best||catOf('public');
  const sub=cat.subs.find(s=>s.toLowerCase().split(/[ /]+/).some(w=>w.length>3&&t.includes(w)))||cat.subs[0];

function readImage(file){return new Promise((res,rej)=>{
  if(!file||!/^image\/(jpeg|png|webp|gif)$/.test(file.type))return rej(new Error('That file is not a supported image. Use a JPG, PNG or WebP photo.'));
  if(file.size>8*1024*1024)return rej(new Error('That photo is larger than 8 MB. Choose a smaller one.'));
  const fr=new FileReader();fr.onerror=()=>rej(new Error('The photo could not be read. Try another one.'));
  fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('That image looks damaged. Try another photo.'));
    im.onload=()=>{const m=900,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.76))};im.src=fr.result};
  fr.readAsDataURL(file)})}

  const act=t=>{const pin=t.closest('.pin'),c=t.closest('.cl');if(pin){st.sel=pin.dataset.id;draw();o.onPin&&o.onPin(pin.dataset.id)}else if(c){zoom(.45,+c.dataset.cx,+c.dataset.cy)}};

const PAL=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)','var(--c7)','var(--c8)','var(--c9)'];

  const r=70,C=2*Math.PI*r;let off=0;const segs=items.filter(x=>x.value).map((x,k)=>{const d=x.value/tot*C,s=`<circle cx="100" cy="100" r="${r}" fill="none" stroke="${x.color||PAL[items.indexOf(x)%9]}" stroke-width="28" stroke-dasharray="${d} ${C-d}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`;off+=d;return s}).join('');
  return`<div class="chart" style="max-width:260px;margin:0 auto"><svg viewBox="0 0 200 200" role="img" aria-label="Doughnut chart, ${tot} total">${segs}<text x="100" y="102" text-anchor="middle" style="font:800 30px 'Bricolage Grotesque',sans-serif;fill:var(--ink)">${tot}</text><text x="100" y="120" text-anchor="middle">${center||'issues'}</text></svg></div>${legend(items)}`}

function lineChart(pts){const mx=Math.max(1,...pts.map(p=>p.value)),W=420,Hh=160,sx=(W-40)/Math.max(1,pts.length-1);

const F={};const fget=k=>F[k]||(F[k]={});
const GROUPS={'Reported':['Reported','AI Analyzed'],'Verified':['Verified','Prioritized'],'In Progress':['In Progress','Pending Approval'],'Resolved':['Resolved','Citizen Confirmed']};
const statusMatch=(i,v)=>!v||(GROUPS[v]?GROUPS[v].includes(i.status):i.status===v);

const distTo=i=>haversine(MYLOC.lat,MYLOC.lng,i.latitude,i.longitude);
function filterIssues(list,f,u){
  const q=(f.q||'').toLowerCase().trim();
  return list.filter(i=>{
    if(q){const hay=[i.id,i.title,i.description,i.location,catOf(i.category).name,(deptOf(i.department)||{}).name||'',isStaff(u)?(userOf(i.reporterId)||{}).name||'':''].join(' ').toLowerCase();if(!hay.includes(q))return false}
    if(f.status&&!statusMatch(i,f.status))return false;if(f.category&&i.category!==f.category)return false;if(f.priority&&i.priorityLevel!==f.priority)return false;
    if(f.department&&i.department!==f.department)return false;if(f.worker&&i.assignedWorker!==f.worker)return false;
    if(f.location&&!i.location.toLowerCase().includes(f.location.toLowerCase()))return false;
    if(f.from&&i.createdAt<new Date(f.from).getTime())return false;if(f.to&&i.createdAt>new Date(f.to).getTime()+D)return false;
    if(f.days&&Date.now()-i.createdAt>f.days*D)return false;
    if(f.sla){const s=slaInfo(i).state;if(f.sla==='over'?s!=='over':f.sla==='near'?s!=='near':f.sla==='ok'?s!=='ok':false)return false}
    if(f.distance&&distTo(i)>f.distance*1000)return false;
    if(f.mine&&!(u&&(i.reporterId===u.id)))return false;if(f.followed&&!(u&&i.followers.includes(u.id)))return false;
    return true});
}

  after(){const d=S.draft;if(!d||S.done)return;

    if(S.step===5&&!S.ai)setTimeout(()=>{if(S.step===5&&S.draft&&!S.ai){S.ai=aiAnalyze({title:d.title,description:d.description,category:d.category,severity:d.severity,latitude:d.lat,longitude:d.lng,reporterId:me().id,photoCount:d.photos.length});render(true)}},750)}};
function syncLoc(){const d=S.draft,c=$('#coords'),a=$('#addr');if(c)c.innerHTML=d.lat!=null?`<span class="chip">${icn('pin')}Lat ${d.lat}</span> <span class="chip">Lng ${d.lng}</span>`:'<span class="muted sm">No point chosen yet. Tap the map or use your location.</span>';if(a)a.value=d.address||''}

  <div class="field mt">${'<label for="addr">Address or landmark</label>'}<input class="in" id="addr" data-draft="address" value="${esc(d.address)}" placeholder="Street, landmark or area"></div>`;

  ${field('Issue title','<input class="in" data-draft="title" maxlength="90" value="'+esc(d.title)+'" placeholder="Large pothole near main road">','','title')}
  ${field('Description','<textarea data-draft="description" maxlength="500" placeholder="Large pothole causing danger to two-wheelers and traffic.">'+esc(d.description)+'</textarea>',`<span id="cnt">${d.description.length}</span>/500 characters. Say what, where exactly, and who is affected.`,'description')}
  <div class="grid g2">${field('Subcategory',`<select data-draft="subcategory">${optList(cat.subs,d.subcategory)}</select>`)}${field('Severity',`<select data-draft="severity">${optList([{v:'auto',l:'Let AI suggest'},'Low','Medium','High','Critical'],d.severity)}</select>`)}</div>

  <audio id="recAudio" class="hide"></audio><label class="lbl" for="vt">Converted text (edit before submitting)</label><textarea class="in" id="vt" data-draft="voiceText" placeholder="If your browser supports speech-to-text, your words appear here.">${esc(d.voiceText)}</textarea>
  <button type="button" class="btn sm mt" data-act="useVoice">Use this text as the description</button><p class="hint mt">Speech-to-text depends on your browser. Telugu, Hindi, Tamil, Kannada, Malayalam, Marathi and English are supported where available.</p></div>`}
  if(S.step===4)return`<h2>Add photo evidence</h2><p class="muted">Photo evidence strengthens verification.</p><div class="row mb"><button class="btn" data-act="addPhoto" data-cam="0">${icn('img')}Upload photos</button><button class="btn" data-act="addPhoto" data-cam="1">${icn('camera')}Take a photo</button><button class="btn" data-act="samplePhoto">${icn('img')}Use sample photo (demo)</button></div>
  <input type="file" id="photoIn" accept="image/*" multiple class="hide"><input type="file" id="camIn" accept="image/*" capture="environment" class="hide">
  <div id="photoList">${d.photos.length?gallery(d.photos,true):'<div class="empty" style="padding:24px">'+icn('camera')+'<p>No photos yet. Reports with a photo are verified faster, but you can continue without one.</p></div>'}</div>

  if(S.step===5)return aiPanel();

function aiPanel(){const a=S.ai,d=S.draft;if(!a)return`<h2>AI-assisted analysis</h2><div class="load" role="status" aria-label="Analysing your report"></div><p class="center muted">Checking category, severity, priority and nearby duplicates…</p>`;

  <div class="banner info mt">${icn('info')}<div>AI-assisted recommendation — final decision is made by authorized personnel.</div></div>`}

function reportDone(){const r=S.done;return`<div class="card center" style="max-width:560px;margin:20px auto"><div style="color:var(--low)">${icn('check','')}</div><h1 style="font-size:2rem">${r.merged?'You joined an existing report':'Your issue has been successfully submitted'}</h1><p class="muted">${r.merged?'Your support was added and you will get updates.':'An authority will verify it. You will be notified at every step.'}</p><p class="b" style="font-size:1.4rem">${r.id}</p>${r.priority?`<p>${prioBadge(r.priority)} priority · ${r.score}/100</p>`:''}${r.flags&&r.flags.length?`<div class="banner warn" style="text-align:left">${icn('flag')}<div>Report flagged for review: ${esc(r.flags.join('; '))}. A person will check it; you will not be penalised.</div></div>`:''}

PAGES.issue={fn(p,u){
  const i=DB.issues.find(x=>x.id===p[0]);if(!i)return`${ph('Issue not found','')}${empty('That issue does not exist','It may have been removed, or the link is wrong.',`<a class="btn pri" href="#/explore">Explore issues</a>`,'search')}`;
  const staff=isStaff(u),cat=catOf(i.category),dept=deptOf(i.department)||deptOf(i.aiDepartment),w=userOf(i.assignedWorker),esc2=escalation(i),pi=i.priorityInfo||{factors:computePriority(i).factors,explanation:''};
  const on=u&&i.confirmations.includes(u.id),fol=u&&i.followers.includes(u.id);
  const banners=[esc2?`<div class="banner crit">${icn('alert')}<div><b>Escalation Required</b> — level ${esc2.level}: ${esc2.who}. This issue is ${dur(slaInfo(i).remaining)} past its deadline.</div></div>`:'',
    i.status==='Rejected'?`<div class="banner crit">${icn('x')}<div><b>Rejected:</b> ${esc(i.rejectionReason||'')}</div></div>`:'',i.status==='Duplicate'?`<div class="banner info">${icn('info')}<div>Merged into <a href="#/issue/${i.mergedInto}">${i.mergedInto}</a>. Updates continue there.</div></div>`:'',
    i.flags&&i.flags.length&&staff?`<div class="banner warn">${icn('flag')}<div><b>Flagged for review:</b> ${esc(i.flags.join('; '))}. Nothing was blocked and no penalty applied.</div></div>`:'',
    i.status==='Appealed'?`<div class="banner info">${icn('shield')}<div>Appeal ${esc(i.appealId||'')} is being reviewed.</div></div>`:''].join('');
  const evidence=i.work&&(i.work.before||i.work.after)?sec('Before and after evidence',`<div class="ba">${['before','after'].map(k=>`<figure>${i.work[k]?`<img src="${i.work[k]}" alt="${k} work photo">`:`<div class="empty" style="padding:30px">${icn('img')}<p>${k==='before'?'Not uploaded':'Waiting for completion'}</p></div>`}<figcaption>${k==='before'?'Before work':'After work'}</figcaption></figure>`).join('')}</div>${i.work.completion?`<p class="mt"><b>Worker notes:</b> ${esc(i.work.completion)}</p>`:''}${i.work.notes&&i.work.notes.length?`<ul class="log">${i.work.notes.map(n=>`<li><span>${esc(n.text)}</span><span class="muted nowrap">${fmtDT(n.ts)}</span></li>`).join('')}</ul>`:''}`):'';
  const comments=`<section class="card mb"><h3>Comments (${i.comments.length})</h3>${i.comments.length?`<ul class="log">${i.comments.map(c=>`<li><span><b>${esc((userOf(c.by)||{name:'Citizen'}).name)}</b>: ${esc(c.text)}</span><span class="muted nowrap">${ago(c.ts)}</span></li>`).join('')}</ul>`:'<p class="muted sm">No comments yet.</p>'}${u?`<form data-form="comment" data-id="${i.id}" class="row mt" novalidate><input class="in grow" name="text" maxlength="500" placeholder="Add a comment or update" aria-label="Comment"><button class="btn" type="submit">Comment</button></form>`:'<p class="sm"><a href="#/login">Sign in</a> to comment.</p>'}</section>`;
  return`<p class="sm"><a href="#/${u?(u.role==='citizen'?'my-reports':'issues'):'explore'}">← Back</a></p>
  <div class="ph"><div><div class="row"><span class="b muted">${i.id}</span>${prioBadge(i.priorityLevel)}${statusBadge(i.status)}${i.anonymous?badge('Anonymous','s-mute'):''}</div><h1 style="margin-top:8px">${esc(i.title)}</h1><p>${icn('pin','').replace('<svg','<svg style="width:15px;height:15px;vertical-align:-2px"')} ${esc(i.location)}</p></div></div>${banners}
  <div class="split"><div>
  ${sec('Description',`<p>${esc(i.description)}</p>${i.voiceText?`<p class="sm muted">Voice transcript: ${esc(i.voiceText)}</p>`:''}${i.photos.length?gallery(i.photos,false):'<p class="sm muted">No photos were attached.</p>'}`)}
  ${evidence}${sec('Location',`<div id="isMap"></div>`)}${sec('Timeline',timelineHTML(i))}${comments}</div>
  <div>${sec('Details',`<dl class="col" style="margin:0;gap:8px">${[['Category',esc(cat.name)+' · '+esc(i.subcategory||'—')],['Department',dept?esc(dept.name)+(i.department?'':' (suggested)'):'—'],['Assigned worker',w?esc(w.name):'Not assigned yet'],['Submitted',fmtDT(i.createdAt)+' by '+esc(displayName(i,u))],['SLA',i.sla?`${i.sla.hours} h · due ${fmtDT(i.sla.deadline)}<br>${slaBadge(i)}`:'Starts when verified'],['Community',`${i.confirmations.length} citizens confirmed this issue`+(i.mergedIds.length?` · ${i.mergedIds.length} merged duplicate${i.mergedIds.length>1?'s':''}`:'')]].map(([k,v])=>`<div><dt class="xs muted">${k}</dt><dd style="margin:0">${v}</dd></div>`).join('')}</dl>`)}

  ${u&&u.role==='citizen'&&isOpen(i)?sec('Community',`<div class="col"><button class="btn ${on?'ok':''}" data-act="confirmIssue" data-id="${i.id}" aria-pressed="${!!on}">${icn('eye')}${on?'You confirmed this · remove':'I see this too'}</button><button class="btn ${fol?'ok':''}" data-act="followIssue" data-id="${i.id}" aria-pressed="${!!fol}">${icn('bell')}${fol?'Following this issue':'Follow'}</button></div>`):''}
  ${sec('Actions',actionsFor(i,u))}</div></div>`},
  after(p){const i=DB.issues.find(x=>x.id===p[0]);if(!i)return;const m=mountMap($('#isMap'),{pins:[pinOf(i)],selected:i.id});m.focus(i.latitude,i.longitude,220)}};
function actionsFor(i,u){const b=[],a=(act,l,cls='',ic='')=>b.push(`<button class="btn ${cls}" data-act="${act}" data-id="${i.id}">${ic?icn(ic):''}${l}</button>`);
  b.push(`<button class="btn" data-act="share" data-id="${i.id}">${icn('share')}Share link</button>`);
  if(!u)return`<div class="col">${b.join('')}<a class="btn pri" href="#/login">Sign in to take part</a></div>`;
  if(isStaff(u)){
    if(['Reported','AI Analyzed'].includes(i.status)){a('openVerify','Verify report','pri','check');a('openInfo','Request more information','','msg');a('openMerge','Merge duplicate','','route');a('openReject','Reject report','dan','x')}
    if(['Verified','Prioritized','Reopened'].includes(i.status)){a('openAssign','Assign department and worker','pri','users');a('openPriority','Change priority','','flag');a('openMerge','Merge duplicate','','route');if(i.status!=='Reopened')a('openReject','Reject report','dan','x')}
    if(i.status==='Assigned'){a('openAssign','Reassign','','users');a('openPriority','Change priority','','flag')}
    if(['In Progress'].includes(i.status))a('openPriority','Change priority','','flag');
    if(i.status==='Pending Approval')a('openReview','Review evidence and decide','pri','check');
    if(i.status==='Appealed')b.push(`<a class="btn pri" href="#/appeals">Open appeals</a>`);
    if(u.role==='admin')a('delIssue','Remove report','dan','trash2')}
  if(u.role==='worker'&&i.assignedWorker===u.id)b.push(`<a class="btn pri" href="#/task/${i.id}">${icn('clip')}Open my task</a>`);
  if(u.role==='citizen'&&isOwner(i,u)){

    if(i.status==='Closed'){if(!i.feedback)a('openFeedback','Give feedback and rate','pri','star');else{const avg=(i.feedback.quality+i.feedback.speed+i.feedback.communication)/3;b.push(`<p class="sm">You rated this ${avg.toFixed(1)} / 5.</p>`);if(avg<=3)a('openAppeal','Appeal resolution','dan','shield')}a('openReopen','Reopen issue','','flag')}
    if(i.status==='Rejected')a('openAppeal','Appeal this decision','pri','shield');

  if(b.length===1&&!['citizen'].includes(u.role))b.push('<p class="sm muted">No other actions at this stage.</p>');
  return`<div class="col">${b.join('')}</div>`}

PAGES.analytics={roles:STAFF,fn(){
  const I=DB.issues,byCat=DB.categories.map(c=>({label:c.name.split(' ')[0],value:I.filter(i=>i.category===c.id).length})).filter(x=>x.value);
  const stat2=[['Reported',['Reported','AI Analyzed'],'var(--c4)'],['Verified',['Verified','Prioritized'],'var(--c1)'],['Assigned',['Assigned'],'var(--c5)'],['Working',['In Progress','Pending Approval'],'var(--c2)'],['Resolved',['Resolved','Citizen Confirmed','Closed'],'var(--c6)'],['Rejected',['Rejected','Duplicate'],'var(--c3)']].map(([l,s,c])=>({label:l,value:I.filter(i=>s.includes(i.status)).length,color:c}));
  const pr=LEVELS.map(l=>({label:l,value:I.filter(i=>i.priorityLevel===l).length,color:`var(--${{Critical:'c3',High:'c7',Medium:'c2',Low:'c6'}[l]})`}));
  const days=[...Array(7)].map((_,k)=>{const d=new Date(Date.now()-(6-k)*D);return{label:d.toLocaleDateString('en-IN',{weekday:'short'}),value:I.filter(i=>i.resolvedAt&&new Date(i.resolvedAt).toDateString()===d.toDateString()).length}});
  const art=DB.categories.map(c=>{const l=I.filter(i=>i.category===c.id&&i.resolvedAt);return{label:c.name.split(' ')[0],value:l.length?+(l.reduce((a,i)=>a+(i.resolvedAt-i.createdAt),0)/l.length/D).toFixed(1):0}}).filter(x=>x.value);
  const sl={ok:0,near:0,over:0};I.forEach(i=>{if(!i.sla)return;const s=slaInfo(i);if(s.state!=='none')sl[s.state]++});
  const slaI=[{label:'Within SLA',value:sl.ok,color:'var(--c6)'},{label:'Near SLA',value:sl.near,color:'var(--c2)'},{label:'Overdue',value:sl.over,color:'var(--c3)'}];
  const spots={};openIssues().forEach(i=>{const n=nearestPlace(i.latitude,i.longitude).name;spots[n]=(spots[n]||0)+1});const sp=Object.entries(spots).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([label,value])=>({label,value,color:'var(--c3)'}));
  const dp=DB.departments.map(d=>{const l=I.filter(i=>i.department===d.id),dn=l.filter(i=>i.resolvedAt);return`<tr><td>${esc(d.name)}</td><td>${l.length}</td><td>${dn.length}</td><td>${l.filter(isOpen).length}</td><td>${dn.length?(dn.reduce((a,i)=>a+(i.resolvedAt-i.createdAt),0)/dn.length/D).toFixed(1)+' d':'—'}</td></tr>`}).join('');
  return`${ph('Analytics','Computed live from the issues in this demo.',exportBtns('issues'))}<div class="grid g2">
  ${sec('Issues by category',donut(byCat))}${sec('Issues by status',bars(stat2))}${sec('Priority distribution',bars(pr))}${sec('Resolution trend (last 7 days)',lineChart(days))}
  ${sec('Average resolution time by category (days)',art.length?hbars(art,' d'):empty('No resolved issues yet','Resolve an issue to see timing.','','chart'))}${sec('SLA performance',`${hbars(slaI)}<p class="hint">Resolved issues count as within or after SLA; open ones by time left.</p>`)}</div>
  ${sec('Department performance',`<div class="tw"><table><thead><tr><th>Department</th><th>Assigned</th><th>Completed</th><th>Pending</th><th>Avg resolution</th></tr></thead><tbody>${dp}</tbody></table></div>`)}
  ${sec('Geographic hotspots',`<div class="grid g2"><div id="heatMap"></div><div>${hbars(sp)}<p class="hint">Open issues by nearest locality. Red glow on the map shows density.</p></div></div>`)}`},
  after(){mountMap($('#heatMap'),{heat:true,pins:openIssues().map(pinOf),onPin:id=>go('/issue/'+id)})}};

  <div class="tabs"><button class="${f.sort!=='new'?'on':''}" data-act="tab" data-k="sug" data-field="sort" data-v="votes">Most upvoted</button><button class="${f.sort==='new'?'on':''}" data-act="tab" data-k="sug" data-field="sort" data-v="new">Newest</button></div><div class="list" id="list-sug">${LISTS.sug()}</div>`}};

function parseRoute(){const h=(location.hash||'#/home').replace(/^#\/?/,'').split('?')[0].split('/').filter(Boolean).map(decodeURIComponent);S.route={name:h[0]||'home',params:h.slice(1)};S.menu=false}
function render(soft){
  clearInterval(S.timer);const u=me(),name=S.route.name,page=PAGES[name]||PAGES.home;
  if(page.roles&&!u){toast('Please sign in to continue.','info');S.after=location.hash;return go('/login')}
  if(page.roles&&!page.roles.includes(u.role)){toast('Your role cannot open that page.','error');return go('/dashboard')}
  if(u&&(name==='login'||name==='register'))return go('/dashboard');
  let html;try{html=page.fn(S.route.params,u)}catch(e){console.error(e);html=`${ph('Something went wrong','')}${empty('This page could not load','Go back home and try again.','<a class="btn pri" href="#/home">Home</a>','alert')}`}
  const y=window.scrollY;$('#root').innerHTML=shell(html,u,page);document.title=`${name==='home'?'':name.replace('-',' ')+' · '}CivicConnect`;
  try{page.after&&page.after(S.route.params,u)}catch(e){console.error(e)}
  if(soft)window.scrollTo(0,y);else{window.scrollTo(0,0);const m=$('#main');if(m)m.focus({preventScroll:true})}}
const apiOk=(r,msg,type='ok')=>{if(!r.ok){toast(r.error,'error');return false}if(msg)toast(msg,type);return true};
const needFile=el=>el&&el.files&&el.files[0];
function showErr(f,msg){const e=$('.form-err',f);if(e){e.textContent=msg;e.classList.remove('hide');e.scrollIntoView({block:'nearest'})}}
function clearErr(f){$$('.form-err',f).forEach(e=>e.classList.add('hide'));$$('.field.bad',f).forEach(x=>x.classList.remove('bad'));$$('.field .err',f).forEach(x=>x.classList.add('hide'))}
function fieldErr(f,name,msg){const fl=$(`[data-field="${name}"]`,f);if(fl){fl.classList.add('bad');const e=$('.err',fl);e.textContent=msg;e.classList.remove('hide')}}
const refreshPhotos=()=>{const el=$('#photoList');if(el)el.innerHTML=S.draft.photos.length?gallery(S.draft.photos,true):'<div class="empty" style="padding:24px">'+icn('camera')+'<p>No photos yet. Reports with a photo are verified faster, but you can continue without one.</p></div>'};
const loginAs=(email,remember=true)=>{const r=api('POST','/api/auth/login',{id:email,password:'demo1234'});if(!r.ok){toast(r.error,'error');return false}setSession(r.data.id,remember);LANG=r.data.language||LANG;return r.data};
function afterLogin(u){const n=unread(u);toast(`Signed in as ${u.name} (${roleName[u.role]})`,'ok');
  if(isStaff(u)){const l=DB.issues.filter(i=>isOpen(i)&&slaInfo(i).state==='near').length,o=DB.issues.filter(i=>isOpen(i)&&slaInfo(i).state==='over').length;
    if(o)setTimeout(()=>toast(`🚨 ${o} issue${o>1?'s':''} escalated: past SLA deadline`,'warn'),900);if(l)setTimeout(()=>toast(`⚠️ SLA deadline approaching on ${l} issue${l>1?'s':''}`,'warn'),1800)}
  else if(n)setTimeout(()=>toast(`🔔 ${n} unread notification${n>1?'s':''}`,'info'),900)}
function geoAsk(cb){const fallback=msg=>{toast(msg,'info');cb({...DEMO_LOC})};if(!navigator.geolocation)return fallback('Location is not available here, so the demo location (Begumpet) is used.');
  navigator.geolocation.getCurrentPosition(p=>{const lat=p.coords.latitude,lng=p.coords.longitude;if(lat<BOUNDS.minLat||lat>BOUNDS.maxLat||lng<BOUNDS.minLng||lng>BOUNDS.maxLng)fallback('You are outside the demo map area, so the demo location (Begumpet) is used.');else cb({lat:+lat.toFixed(5),lng:+lng.toFixed(5),name:'Your location',real:true})},()=>fallback('Location permission was not granted, so the demo location (Begumpet) is used.'),{timeout:6000})}
const setLoc=(lat,lng,addr)=>{const d=S.draft;d.lat=+(+lat).toFixed(5);d.lng=+(+lng).toFixed(5);d.address=addr||placeLabel(d.lat,d.lng);d.addrEdited=false;if(S.pickMap){S.pickMap.setPick({lat:d.lat,lng:d.lng});S.pickMap.focus(d.lat,d.lng,420)}syncLoc()};

/* ---------- modals for issue actions ---------- */
const need1=(v,m)=>v&&String(v).trim().length>=5?null:m;
const deptOpts=sel=>optList(DB.departments.map(d=>({v:d.id,l:d.name})),sel);
function mVerify(id){const i=DB.issues.find(x=>x.id===id);if(!i)return;const hrs=slaHours(i.priorityLevel,i.aiDepartment);
  Modal.open({title:`Verify ${i.id}`,submit:'Verify report',body:`<div class="row mb">${ring(i.priorityScore,i.priorityLevel)}<div class="grow"><b>AI-assisted priority ${i.priorityScore}/100</b><p class="sm" style="margin:2px 0">${esc((i.priorityInfo||{}).explanation||'')}</p></div></div>${field('Priority level',`<select name="level">${optList(LEVELS,i.priorityLevel)}</select>`,'Change it only if you disagree with the AI suggestion.')}${field('Reason for change (needed if you change the level)','<input class="in" name="reason" maxlength="160">')}${field('Department',`<select name="department">${deptOpts(i.aiDepartment)}</select>`)}${field('SLA (hours)',`<input class="in" type="number" min="1" name="hours" value="${hrs}">`,'Defaults: Critical 24 h, High 48 h, Medium 5 days, Low 10 days, capped by the department standard.')}`,
    onSubmit:f=>{const r=api('POST',`/api/issues/${id}/verify`,{...f,hours:+f.hours});if(!r.ok)return r.error;toast('Issue verified successfully.','ok');return true}})}
function mReason(id,{title,path,label,submit,msg,danger=true,extra=''}){Modal.open({title,submit,danger,body:`${extra}${field(label,'<textarea name="reason" maxlength="300"></textarea>')}`,onSubmit:f=>{const r=api('POST',path,{reason:f.reason,message:f.reason});if(!r.ok)return r.error;toast(msg,'ok');return true}})}
function mAssign(id){const i=DB.issues.find(x=>x.id===id);if(!i)return;const dep=i.department||i.aiDepartment,ws=DB.users.filter(x=>x.role==='worker'&&x.active).sort((a,b)=>(b.deptId===dep)-(a.deptId===dep));
  Modal.open({title:`Assign ${i.id}`,submit:'Assign',body:`${field('Department',`<select name="department">${deptOpts(dep)}</select>`)}${field('Field worker',`<select name="workerId">${ws.map((w,k)=>`<option value="${w.id}" ${k===0?'selected':''}>${esc(w.name)} — ${esc((deptOf(w.deptId)||{name:'General'}).name)}</option>`).join('')}</select>`)}${field('SLA (hours)',`<input class="in" type="number" min="1" name="hours" value="${i.sla&&i.status!=='Reopened'?i.sla.hours:slaHours(i.priorityLevel,dep)}">`)}`,
    onSubmit:f=>{const r=api('POST',`/api/issues/${id}/assign`,{...f,hours:+f.hours});if(!r.ok)return r.error;toast('Worker assigned.','ok');return true}})}
function mPriority(id){const i=DB.issues.find(x=>x.id===id);Modal.open({title:`Change priority · ${i.id}`,submit:'Save priority',body:`${field('Priority level',`<select name="level">${optList(LEVELS,i.priorityLevel)}</select>`)}${field('Reason (required)','<input class="in" name="reason" maxlength="160">')}`,onSubmit:f=>{if(f.level===i.priorityLevel)return'Choose a different level, or cancel.';const r=api('PUT',`/api/issues/${id}`,f);if(!r.ok)return r.error;toast('Priority updated.','ok');return true}})}
function mMerge(id){const i=DB.issues.find(x=>x.id===id);const c=DB.issues.filter(o=>o.id!==id&&isOpen(o)&&o.category===i.category).sort((a,b)=>haversine(i.latitude,i.longitude,a.latitude,a.longitude)-haversine(i.latitude,i.longitude,b.latitude,b.longitude)).slice(0,12);
  if(!c.length)return toast('There is no similar open issue to merge into.','info');
  Modal.open({title:`Merge ${i.id} into…`,submit:'Merge duplicate',body:`<p class="sm muted">All citizen reports are kept as supporters of the main issue.</p>${field('Main issue',`<select name="masterId">${c.map(o=>`<option value="${o.id}">${o.id} · ${esc(o.title)} · ${fmtDist(haversine(i.latitude,i.longitude,o.latitude,o.longitude))}</option>`).join('')}</select>`)}`,onSubmit:f=>{const r=api('POST',`/api/issues/${id}/merge`,f);if(!r.ok)return r.error;toast('Merged. Supporters were kept.','ok');go('/issue/'+f.masterId);return true}})}
function mReview(id){const i=DB.issues.find(x=>x.id===id);if(!i||!i.work)return;
  Modal.open({title:`Review evidence · ${i.id}`,wide:true,noActions:true,body:`<div class="ba">${['before','after'].map(k=>`<figure>${i.work[k]?`<img src="${i.work[k]}" alt="${k} photo">`:'<p class="muted">Missing</p>'}<figcaption>${k==='before'?'Before work':'After work'}</figcaption></figure>`).join('')}</div><p class="mt"><b>Worker:</b> ${esc((userOf(i.assignedWorker)||{name:'—'}).name)}<br><b>Notes:</b> ${esc(i.work.completion||'—')}</p><div class="acts"><button type="button" class="btn" data-act="closeModal">Close</button><button type="button" class="btn dan" data-act="rejectRes" data-id="${id}">Reject resolution</button><button type="button" class="btn pri" data-act="approveRes" data-id="${id}">Approve resolution</button></div>`})}
function mFeedback(id){Modal.rating={quality:0,speed:0,communication:0};
  const row=(k,l)=>`<div class="rating-row"><span>${l}</span><span role="group" aria-label="${l} rating">${[1,2,3,4,5].map(v=>`<button type="button" class="star" data-act="star" data-k="${k}" data-v="${v}" aria-label="${v} star${v>1?'s':''}">★</button>`).join('')}</span></div>`;
  Modal.open({title:'How satisfied are you?',submit:'Submit feedback',body:`${row('quality','Quality of work')}${row('speed','Resolution speed')}${row('communication','Communication')}${field('Comment (optional)','<textarea name="comment" maxlength="300"></textarea>')}`,onSubmit:f=>{const r=api('POST',`/api/issues/${id}/feedback`,{...Modal.rating,comment:f.comment});if(!r.ok)return r.error;const avg=(Modal.rating.quality+Modal.rating.speed+Modal.rating.communication)/3;toast('Thank you. Your feedback was saved.','ok');if(avg<=2)setTimeout(()=>toast('Not satisfied? You can appeal the resolution from the issue page.','info'),900);return true}})}
function mAppeal(id){Modal.open({title:'Appeal this decision',submit:'Submit appeal',body:`${field('Reason',`<select name="reason">${optList(['Report was rejected by mistake','Issue was closed but is not fixed','Resolution is unsatisfactory','Other'],'')}</select>`)}${field('What should the authority know?','<textarea name="description" maxlength="400"></textarea>')}${field('Supporting photo (optional)','<input type="file" name="evidence" accept="image/*" class="in">')}`,
  onSubmit:async(f,form)=>{let ev=[];const file=needFile($('input[type=file]',form));if(file){try{ev=[await readImage(file)]}catch(e){return e.message}}const r=api('POST',`/api/issues/${id}/appeal`,{reason:f.reason,description:f.description,evidence:ev});if(!r.ok)return r.error;toast('Appeal submitted. ID '+r.data.id,'ok');return true}})}
function mSimple(id,{title,path,label,submit,msg,req=false}){Modal.open({title,submit,body:field(label,'<textarea name="reason" maxlength="300"></textarea>'),onSubmit:f=>{if(req&&f.reason.trim().length<5)return'Add a few words so the authority can act on this.';const r=api('POST',path,{reason:f.reason});if(!r.ok)return r.error;toast(msg,'ok');return true}})}
function mDept(d){Modal.open({title:d?'Edit department':'Add department',body:`${field('Name',`<input class="in" name="name" value="${esc(d?d.name:'')}">`)}${d?'':field('Category it serves',`<select name="category">${optList(DB.categories.map(c=>({v:c.id,l:c.name})),'')}</select>`)}${field('Service area',`<input class="in" name="area" value="${esc(d?d.area:'')}">`)}${field('Standard SLA (hours)',`<input class="in" type="number" min="1" name="sla" value="${d?d.sla:48}">`)}`,

  const r=api('POST','/api/auth/login',{id:d.id,password:d.password});if(!r.ok)return showErr(f,r.error);setSession(r.data.id,d.remember);const a=S.after;S.after=null;afterLogin(r.data);go(a&&a.startsWith('#/')&&!a.includes('login')?a.slice(1):'/dashboard')},
register(f,d){clearErr(f);const r=api('POST','/api/auth/register',d);if(!r.ok)return showErr(f,r.error);setSession(r.data.id,true);toast('Account created. Welcome to CivicConnect!','ok');go('/dashboard')},
comment(f,d){const r=api('POST',`/api/issues/${f.dataset.id}/comments`,d);if(apiOk(r,'Comment added.'))render(true)},
sugComment(f,d){const r=api('POST',`/api/suggestions/${f.dataset.id}/comments`,d);if(apiOk(r,'Comment added.'))render(true)},
async suggest(f,d){clearErr(f);let photo=null;const file=needFile($('input[type=file]',f));if(file){try{photo=await readImage(file)}catch(e){return showErr(f,e.message)}}
  const r=api('POST','/api/suggestions',{...d,photo});if(!r.ok)return showErr(f,r.error);toast('Suggestion submitted. Thank you!','ok');render(true)},
wkProgress(f,d){const r=api('POST',`/api/issues/${f.dataset.id}/progress`,{progress:+d.progress,note:d.note});if(!r.ok)return showErr(f,r.error);toast('Progress saved.','ok');render(true)},
wkComplete(f,d){const r=api('POST',`/api/issues/${f.dataset.id}/complete`,{note:d.note});if(!r.ok)return showErr(f,r.error);toast('Submitted for verification. The authority was notified.','ok');render(true)},
rules(f,d){const weights={};['severity','impact','safety','community','age'].forEach(k=>weights[k]=+d['w_'+k]);const r=api('PUT','/api/settings',{weights,thresholds:{Critical:+d.t_Critical,High:+d.t_High,Medium:+d.t_Medium}});if(!r.ok)return showErr(f,r.error);toast('Priority rules saved. Scores were recalculated.','ok')},
sla(f,d){const sla={};LEVELS.forEach(l=>sla[l]=+d['s_'+l]);const r=api('PUT','/api/settings',{sla});if(!r.ok)return showErr(f,r.error);toast('SLA saved. It applies to newly verified issues.','ok')},
dup(f,d){const r=api('PUT','/api/settings',{dup:{radius:+d.radius,threshold:+d.threshold}});if(!r.ok)return showErr(f,r.error);toast('Duplicate rules saved.','ok')},
tpl(f,d){const r=api('PUT','/api/settings',{templates:d});if(apiOk(r,'Templates saved.'));},
profile(f,d){clearErr(f);const r=api('PUT','/api/me',d);if(!r.ok)return showErr(f,r.error);LANG=d.language;LS.setItem('cc_lang',LANG);toast('Profile saved.','ok');render(true)}
};

/* ---------- search ---------- */
function doSearch(q){q=q.trim().toLowerCase();const box=$('#sr');if(!box)return;if(q.length<2){box.classList.add('hide');return}
  const u=me(),is=DB.issues.filter(i=>[i.id,i.title,i.description,i.location,catOf(i.category).name,(deptOf(i.department)||{}).name||''].join(' ').toLowerCase().includes(q)).slice(0,6);
  const us=u&&isStaff(u)?DB.users.filter(x=>(x.name+x.email).toLowerCase().includes(q)).slice(0,3):[],ds=u&&isStaff(u)?DB.departments.filter(d=>d.name.toLowerCase().includes(q)).slice(0,3):[];
  const h=(is.length?`<h5>Issues</h5>${is.map(i=>`<a href="#/issue/${i.id}"><b>${i.id}</b> ${esc(i.title)}<small>${esc(i.location)} · ${i.status}</small></a>`).join('')}`:'')+(ds.length?`<h5>Departments</h5>${ds.map(d=>`<a href="#/departments">${esc(d.name)}</a>`).join('')}`:'')+(us.length?`<h5>People</h5>${us.map(x=>`<a href="${u.role==='admin'?'#/users':'#/workers'}">${esc(x.name)}<small>${roleName[x.role]}</small></a>`).join('')}`:'');
  box.innerHTML=h||'<div style="padding:12px" class="sm muted">No results. Try a place, an issue ID or a category.</div>';box.classList.remove('hide')}

/* ---------- global events ---------- */
document.addEventListener('click',e=>{
  const bg=e.target.closest('[data-bg]');if(bg&&e.target===bg){Modal.close();return}
  if(!e.target.closest('.menu')&&S.menu){S.menu=false;const m=$('.menu');if(m)m.classList.remove('open')}
  if(!e.target.closest('.search')){const s=$('#sr');if(s)s.classList.add('hide')}
  const el=e.target.closest('[data-act]');if(!el)return;const fn=ACT[el.dataset.act];if(!fn)return;
  if(el.tagName==='A'&&el.getAttribute('href')==='#')e.preventDefault();fn(el,e)});
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.draft!==undefined&&S.draft){S.draft[el.dataset.draft]=el.value;if(el.dataset.draft==='address')S.draft.addrEdited=true;if(el.dataset.draft==='description'){const c=$('#cnt');if(c)c.textContent=el.value.length}}
  if(el.dataset.f){const[k,fld]=el.dataset.f.split(':'),f=fget(k);let v=el.value;if(v==='')delete f[fld];else f[fld]=['distance','days','radiusKm'].includes(fld)?Number(v):v;refreshList(k);if(k==='nearby'||(el.tagName==='SELECT'&&(k==='map'||k==='explore'))){}}
  if(el.dataset.search!==undefined)doSearch(el.value);
  if(el.id==='prog'){$('#progV').textContent=el.value+'%';el.setAttribute('aria-valuetext',el.value+' percent')}
  if(el.dataset.w){$('#wv_'+el.dataset.w).textContent=el.value;const t=$$('[data-w]').reduce((a,x)=>a+ +x.value,0);const s=$('#wsum');if(s)s.textContent='(total '+t+')'}});
document.addEventListener('change',async e=>{const el=e.target;
  if(el.dataset.lang!==undefined){LANG=el.value;LS.setItem('cc_lang',LANG);render(true)}
  if(el.dataset.draftCheck&&S.draft)S.draft[el.dataset.draftCheck]=el.checked;
  if(el.dataset.blur&&S.draft)S.draft.blur[el.dataset.blur]=el.checked;
  if(el.dataset.f&&el.tagName==='SELECT'){const k=el.dataset.f.split(':')[0];if(k==='nearby')render(true);else if(AFTER[k]){}}
  if(el.dataset.pref){const[g,k]=el.dataset.pref.split('.');const r=api('PUT','/api/me',{[g]:{[k]:el.checked}});apiOk(r,'Saved.')}
  if(el.dataset.userrole){const r=api('PUT','/api/users/'+el.dataset.userrole,{role:el.value});if(apiOk(r,'Role updated.')){}else render(true)}
  if(el.dataset.catactive){const r=api('PUT','/api/categories/'+el.dataset.catactive,{active:el.checked});apiOk(r,el.checked?'Category enabled.':'Category hidden from citizens.')}
  if(el.dataset.sugstatus){const r=api('PUT','/api/suggestions/'+el.dataset.sugstatus,{status:el.value});if(apiOk(r,'Suggestion marked '+el.value+'.'))render(true)}
  if(el.id==='photoIn'||el.id==='camIn'){const fs=[...el.files];el.value='';for(const f of fs){try{S.draft.photos.push(await readImage(f))}catch(err){toast(err.message,'error')}}refreshPhotos()}
  if(el.id==='wkPhoto'&&needFile(el)){const f=el.files[0];el.value='';try{const img=await readImage(f),i=DB.issues.find(x=>x.id===S.route.params[0]);const r=api('POST',`/api/issues/${i.id}/progress`,{[S.wkKind]:img});if(apiOk(r,(S.wkKind==='before'?'Before':'After')+' photo uploaded.'))render(true)}catch(err){toast(err.message,'error')}}
  if(el.id==='profPhoto'&&needFile(el)){try{const img=await readImage(el.files[0]);const r=api('PUT','/api/me',{photo:img});if(apiOk(r,'Photo updated.'))render(true)}catch(err){toast(err.message,'error')}}});
document.addEventListener('submit',async e=>{const f=e.target;e.preventDefault();
  if(f.matches('[data-modal-form]')){if(!Modal.handler)return;const r=await Modal.handler(formData(f),f);if(r===true){Modal.close();render(true)}else if(typeof r==='string')Modal.err(r);return}
  const fn=FORMS[f.dataset.form];if(fn)fn(f,formData(f),e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal-root').innerHTML)Modal.close();
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.search!==undefined){e.preventDefault();fget('explore').q=e.target.value;$('#sr').classList.add('hide');go('/explore')}
  if(e.key==='Enter'&&e.target.id==='locq'){e.preventDefault();ACT.locSearch()}});
window.addEventListener('hashchange',()=>{Modal.close();parseRoute();render()});

/* ---------- boot ---------- */
(function init(){
  const th=LS.getItem('cc_theme');if(th)document.documentElement.dataset.theme=th;
  onNotify=n=>{const u=me();if(u&&n.userId===u.id)toast('🔔 '+n.title+': '+n.message,'info')};
  const u=me();if(u&&!u.active)setSession(null);
  parseRoute();render();
})();
</script>
</body>
